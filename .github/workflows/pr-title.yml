# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: PR Title

# PRs are squash-merged, so the PR title becomes the commit subject that
# release-please reads. A title that is not a conventional commit is silently
# left out of the changelog and the version bump.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # read-only: the action only reads the PR title to lint it
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
