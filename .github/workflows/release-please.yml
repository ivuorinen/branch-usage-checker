# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Release Please

on:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release commits, tags, and GitHub releases
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Prefer a PAT/App token so the release PR triggers CI (GITHUB_TOKEN
          # cannot — GitHub's recursion guard). Falls back to GITHUB_TOKEN when
          # RELEASE_PLEASE_TOKEN is unset.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-phar:
    name: Publish the PHAR
    # Runs here rather than on a `release: created` event: a release created
    # with GITHUB_TOKEN does not trigger other workflows, so a separate
    # release-triggered workflow would never see release-please's releases.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the PHAR asset to the release
    env:
      # Through the environment, never interpolated into `run:`.
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # Build from the tag, not the push commit: release-please tags a merged
      # release PR on whichever run first succeeds, so a release created on a
      # later push points at an older commit than github.sha.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          ini-values: phar.readonly=0
          extensions: fileinfo
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Build PHAR
        run: |
          cp application application.phar
          php application app:build branch-usage-checker --build-version="$TAG_NAME"

      - name: Ensure the PHAR works
        run: builds/branch-usage-checker --version

      - name: Upload the PHAR to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" builds/branch-usage-checker --clobber --repo "$GITHUB_REPOSITORY"
